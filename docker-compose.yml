services:
  postgres:
    container_name: jspr_vc_postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: xxxxxxx # local only password
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - jspr_vc_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: jspr_vc_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - jspr_vc_network
    restart: unless-stopped

networks:
  jspr_vc_network:
    driver: bridge

volumes:
  postgres:
  pgadmin:
